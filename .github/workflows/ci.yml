name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build isolated verification image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infrastructure/ci/Dockerfile
          load: true
          tags: greiva-ci:local
          cache-from: type=gha,scope=greiva-ci
          cache-to: type=gha,mode=max,scope=greiva-ci
      - name: Typecheck, unit tests and native UI regression
        run: |
          mkdir -p .data/ci-results
          docker run --rm --init --shm-size=1g \
            -v "$GITHUB_WORKSPACE/.data/ci-results:/evidence" \
            greiva-ci:local
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/ci-results
          if-no-files-found: warn
          retention-days: 14
