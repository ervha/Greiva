[package]
name = "greiva-page-store"
version = "0.6.4"
edition = "2021"

[features]
default = []
# Only the Docker crash-test driver enables this; Tauri builds do not.
crash-test-hooks = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
