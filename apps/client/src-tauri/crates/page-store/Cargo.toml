[package]
name = "greiva-page-store"
version = "0.94.0"
edition = "2021"

[features]
default = []
# Only the Docker crash-test driver enables this; Tauri builds do not.
crash-test-hooks = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
zeroize = "=1.9.0"
base64 = "=0.22.1"
getrandom = "=0.2.17"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
