[package]
name = "greiva-poc"
version = "0.60.0"
edition = "2021"

[lib]
name = "greiva_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"] }
greiva-page-store = { path = "crates/page-store" }
tokio = { version = "=1.53.1", features = ["sync"] }
serde_json = "=1.0.151"
