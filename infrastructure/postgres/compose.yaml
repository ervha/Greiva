name: greiva-poc
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: greiva_poc
      POSTGRES_USER: greiva
      POSTGRES_PASSWORD: greiva_dev_only
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greiva -d greiva_poc"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
